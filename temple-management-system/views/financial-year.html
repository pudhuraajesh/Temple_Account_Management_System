<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Year</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <h2>Create Financial Year</h2>

    <form action="/financial-year" method="POST">

        <input type="text" name="name" placeholder="Name" required>

        <input type="text" id="mobile" name="mobile" placeholder="Mobile Number" required>

        <input type="text" name="financial_year" placeholder="Enter Financial Year" required>

        <button type="submit">Create</button>

    </form>

</div>

<script src="/js/script.js"></script>

</body>
</html>
