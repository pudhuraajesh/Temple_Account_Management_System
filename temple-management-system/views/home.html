<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .top-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #f4f4f4;
        }

        .left-buttons,
        .right-buttons{
            display: flex;
            gap: 15px;
        }

       .top-btn{
    padding: 10px 18px !important;
    border: none !important;
    background-color: #ffa500 !important;   /* orange */
    color: white !important;
    border-radius: 6px !important;
    cursor: pointer;
    font-size: 14px !important;
}
.top-btn:hover{
    background-color: #e69500 !important;
}

        .container{
            text-align: center;
            margin-top: 80px;
        }
    </style>

</head>

<body>

<div class="top-bar">

    <!-- LEFT SIDE -->
    <div class="left-buttons">

        <a href="/financial-years">
            <button class="top-btn">Financial Years</button>
        </a>

        <a href="/create-financial-year">
            <button class="top-btn">Create Financial Year</button>
        </a>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-buttons">

        <a href="/profile">
            <button class="top-btn">Profile</button>
        </a>

        <a href="/logout">
            <button class="top-btn">Logout</button>
        </a>

    </div>

</div>

<div class="container">

    <h1>Temple Account Management System</h1>
    <p>Welcome to Home Page</p>

</div>

</body>

</html>
